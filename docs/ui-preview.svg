<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="760" rx="16" fill="#0b0e14"/>
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M0 34 H1200 M0 68 H1200 M0 102 H1200 M0 136 H1200 M0 170 H1200 M0 204 H1200 M0 238 H1200 M0 272 H1200 M0 306 H1200 M0 340 H1200 M0 374 H1200 M0 408 H1200 M0 442 H1200 M0 476 H1200 M0 510 H1200 M0 544 H1200 M0 578 H1200 M0 612 H1200 M0 646 H1200 M0 680 H1200 M0 714 H1200"/>
    <path d="M34 0 V760 M68 0 V760 M102 0 V760 M136 0 V760 M170 0 V760 M204 0 V760 M238 0 V760 M272 0 V760"/>
  </g>

  <!-- 侧边栏 -->
  <rect x="14" y="14" width="262" height="732" rx="14" fill="#12161f" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- 品牌 -->
  <text x="30" y="48" font-size="20" font-weight="800" font-family="'JetBrains Mono', Menlo, monospace">
    <tspan fill="url(#accent)">&gt;_</tspan>
  </text>
  <text x="78" y="44" font-size="15" font-weight="700" fill="#e6e9f0">璇玑 xuanji</text>
  <text x="78" y="60" font-size="11" fill="#6b7484">agent harness · 工作台</text>
  <line x1="28" y1="72" x2="262" y2="72" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- 工作区卡 -->
  <rect x="28" y="86" width="234" height="92" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="40" y="108" font-size="12" font-weight="600" fill="#9aa3b2">📁 工作区</text>
  <text x="40" y="130" font-size="12" fill="#e6e9f0" font-family="'JetBrains Mono', Menlo, monospace">/Users/dz/workspace/个人作品</text>
  <text x="40" y="146" font-size="12" fill="#e6e9f0" font-family="'JetBrains Mono', Menlo, monospace">/xuanji/examples</text>
  <text x="40" y="166" font-size="10.5" fill="#6b7484">agent 生成的文件都在此目录，与产品代码隔离</text>

  <!-- 运行环境卡 -->
  <rect x="28" y="192" width="234" height="66" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="40" y="214" font-size="12" font-weight="600" fill="#9aa3b2">🛰 运行环境</text>
  <text x="40" y="236" font-size="12" fill="#6b7484">provider</text>
  <text x="180" y="236" font-size="12" fill="#9aa3b2" font-family="'JetBrains Mono', Menlo, monospace" text-anchor="end">openai-compatible</text>
  <text x="40" y="254" font-size="12" fill="#6b7484">model</text>
  <rect x="116" y="240" width="98" height="20" rx="6" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="120" y="254" font-size="11.5" fill="#e6e9f0" font-family="'JetBrains Mono', Menlo, monospace">deepseek-v4-flash ▾</text>

  <!-- 工具卡 -->
  <rect x="28" y="272" width="234" height="118" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="40" y="294" font-size="12" font-weight="600" fill="#9aa3b2">🧰 工具</text>
  <rect x="76" y="280" width="26" height="16" rx="8" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>
  <text x="89" y="292" font-size="10" fill="#22d3ee" font-family="'JetBrains Mono', Menlo, monospace" text-anchor="middle">8</text>
  <g font-size="11" font-family="'JetBrains Mono', Menlo, monospace">
    <rect x="40" y="306" width="104" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="50" y="321" fill="#9aa3b2">fs.read_file</text>
    <rect x="152" y="306" width="98" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="162" y="321" fill="#9aa3b2">fs.write_file</text>
    <rect x="40" y="336" width="96" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="50" y="351" fill="#9aa3b2">fs.list_dir</text>
    <rect x="144" y="336" width="90" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="154" y="351" fill="#9aa3b2">shell.run</text>
    <rect x="40" y="366" width="120" height="22" rx="6" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.25"/><text x="50" y="381" fill="#22d3ee">weather.current</text>
  </g>

  <!-- 技能卡 -->
  <rect x="28" y="404" width="234" height="100" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="40" y="426" font-size="12" font-weight="600" fill="#9aa3b2">📚 技能</text>
  <rect x="76" y="412" width="26" height="16" rx="8" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>
  <text x="89" y="424" font-size="10" fill="#22d3ee" font-family="'JetBrains Mono', Menlo, monospace" text-anchor="middle">3</text>
  <g font-size="11" font-family="'JetBrains Mono', Menlo, monospace">
    <rect x="40" y="438" width="104" height="22" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.25"/><text x="50" y="453" fill="#a78bfa">code-review</text>
    <rect x="152" y="438" width="98" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="162" y="453" fill="#9aa3b2">commit-message</text>
    <rect x="40" y="468" width="96" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="50" y="483" fill="#9aa3b2">sqlite-query</text>
  </g>

