<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="14" fill="#0b0e14"/>
  <rect x="14" y="14" width="240" height="672" rx="12" fill="#12161f" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="28" y="46" font-size="20" font-weight="800" font-family="'JetBrains Mono', Menlo, monospace" fill="url(#accent)">&gt;_</text>
  <text x="70" y="42" font-size="14" font-weight="700" fill="#e6e9f0">璇玑<span fill="#6b7484"> xuanji</span></text>
  <text x="70" y="58" font-size="10.5" fill="#6b7484">agent harness · 工作台</text>
  <rect x="24" y="70" width="110" height="30" rx="8" fill="#ffffff" fill-opacity="0.03"/>
  <text x="79" y="90" font-size="12.5" fill="#9aa3b2" text-anchor="middle">💬 对话</text>
  <rect x="142" y="70" width="100" height="30" rx="8" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/>
  <text x="192" y="90" font-size="12.5" fill="#22d3ee" text-anchor="middle">📊 观测台</text>
  <!-- 主区 -->
  <rect x="268" y="14" width="918" height="672" rx="12" fill="#0f131c" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="292" y="48" font-size="17" font-weight="700" fill="#e6e9f0">📊 观测台</text>
  <text x="1150" y="48" font-size="12" fill="#9aa3b2" text-anchor="end">↻ 刷新</text>
  <!-- 效果评估 -->
  <rect x="292" y="64" width="870" height="596" rx="11" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="308" y="88" font-size="13" font-weight="600" fill="#9aa3b2">📈 效果评估</text>
  <rect x="700" y="74" width="110" height="24" rx="7" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="710" y="90" font-size="11" fill="#9aa3b2" font-family="'JetBrains Mono', Menlo, monospace">v1</text>
  <rect x="818" y="74" width="130" height="24" rx="7" fill="url(#accent)"/>
  <text x="883" y="90" font-size="11.5" font-weight="700" fill="#0b0e14" text-anchor="middle">▶ 运行评测集</text>
  <text x="308" y="118" font-size="11" fill="#6b7484">内置场景化评测集（examples/eval/demo-cases.json）· mock 离线运行 · 产出通过率 / token / 工具效率指标</text>
  <!-- 报告 summary -->
  <rect x="308" y="132" width="838" height="40" rx="9" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.25"/>
  <text x="322" y="158" font-size="12.5" fill="#22d3ee" font-family="'JetBrains Mono', Menlo, monospace">v1 · 通过 5/5 (100%) · 总 token 1860 · 平均 372 tok / 1.6 工具 · 总耗时 24.3s</text>
  <!-- 表格 -->
  <g font-family="'JetBrains Mono', Menlo, monospace">
    <text x="322" y="198" font-size="10.5" fill="#6b7484">用例</text>
    <text x="470" y="198" font-size="10.5" fill="#6b7484">状态</text>
    <text x="560" y="198" font-size="10.5" fill="#6b7484">工具</text>
    <text x="660" y="198" font-size="10.5" fill="#6b7484">token</text>
    <text x="760" y="198" font-size="10.5" fill="#6b7484">耗时</text>
    <text x="860" y="198" font-size="10.5" fill="#6b7484">结果</text>
    <line x1="308" y1="206" x2="1146" y2="206" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="322" y="232" font-size="12" fill="#e6e9f0">list-workspace</text>
    <text x="470" y="232" font-size="12" fill="#9aa3b2">ok</text>
    <text x="560" y="232" font-size="12" fill="#9aa3b2">1</text>
    <text x="660" y="232" font-size="12" fill="#9aa3b2">310</text>
    <text x="760" y="232" font-size="12" fill="#9aa3b2">4.2s</text>
    <text x="860" y="232" font-size="12" fill="#34d399">✓</text>
    <line x1="308" y1="244" x2="1146" y2="244" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="322" y="270" font-size="12" fill="#e6e9f0">read-and-summarize</text>
    <text x="470" y="270" font-size="12" fill="#9aa3b2">ok</text>
    <text x="560" y="270" font-size="12" fill="#9aa3b2">2</text>
    <text x="660" y="270" font-size="12" fill="#9aa3b2">412</text>
    <text x="760" y="270" font-size="12" fill="#9aa3b2">5.1s</text>
    <text x="860" y="270" font-size="12" fill="#34d399">✓</text>
    <line x1="308" y1="282" x2="1146" y2="282" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="322" y="308" font-size="12" fill="#e6e9f0">web-search</text>
    <text x="470" y="308" font-size="12" fill="#9aa3b2">ok</text>
    <text x="560" y="308" font-size="12" fill="#9aa3b2">1</text>
    <text x="660" y="308" font-size="12" fill="#9aa3b2">298</text>
    <text x="760" y="308" font-size="12" fill="#9aa3b2">3.8s</text>
    <text x="860" y="308" font-size="12" fill="#34d399">✓</text>
    <line x1="308" y1="320" x2="1146" y2="320" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="322" y="346" font-size="12" fill="#e6e9f0">weather-no-city</text>
    <text x="470" y="346" font-size="12" fill="#9aa3b2">ok</text>
    <text x="560" y="346" font-size="12" fill="#9aa3b2">1</text>
    <text x="660" y="346" font-size="12" fill="#9aa3b2">402</text>
    <text x="760" y="346" font-size="12" fill="#9aa3b2">6.0s</text>
    <text x="860" y="346" font-size="12" fill="#34d399">✓</text>
    <line x1="308" y1="358" x2="1146" y2="358" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="322" y="384" font-size="12" fill="#e6e9f0">direct-answer</text>
    <text x="470" y="384" font-size="12" fill="#9aa3b2">ok</text>
    <text x="560" y="384" font-size="12" fill="#9aa3b2">0</text>
    <text x="660" y="384" font-size="12" fill="#9aa3b2">438</text>
    <text x="760" y="384" font-size="12" fill="#9aa3b2">5.2s</text>
    <text x="860" y="384" font-size="12" fill="#34d399">✓</text>
    <line x1="308" y1="396" x2="1146" y2="396" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>
  <!-- 说明 -->
  <text x="308" y="430" font-size="11.5" fill="#6b7484">每个用例的结果都关联对应运行轨迹，可点击跳转链路详情 —— 指标可量化、可溯源。</text>
  <text x="308" y="450" font-size="11.5" fill="#6b7484">支持 eval diff 版本回归：通过率 / token 变化、新增失败用例一目了然。</text>
</svg>
